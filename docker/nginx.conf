server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Application monopage (go_router) : toute URL inconnue renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fichiers d'amorçage : jamais en cache, pour récupérer chaque nouvelle version
    location ~ ^/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|manifest\.json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Ressources statiques : cache navigateur de 7 jours
    location ~* \.(?:js|css|png|jpg|jpeg|svg|ico|ttf|otf|woff2?|wasm|json)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}