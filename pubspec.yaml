name: cairn
description: Suivi du patrimoine net et de la progression vers le premier million.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Versions vérifiées sur les dépôts officiels le 28/09/2026.
  crypto: ^3.0.6
  fl_chart: ^1.2.0
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  # go_router 18 migre vers le paquet material_ui ; on reste sur 17.x tant que
  # le framework expose encore package:flutter/material.dart (Flutter 3.47).
  go_router: ">=17.5.0 <18.0.0"
  intl: ^0.20.2
  local_auth: ^3.0.2
  meta: ^1.16.0
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
