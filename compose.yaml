# Démarrer : copy .env.example .env   puis   docker compose up -d --build
# Arrêter  : docker compose down
services:
  api:
    build: ./api
    image: cairn-api:${TAG:-dev}
    container_name: cairn-api
    env_file:
      - path: .env
        required: false      # sans .env, les valeurs par défaut s'appliquent
    environment:
      PORT: "3000"           # doit rester identique à docker/nginx-api.conf
    expose:
      - "3000"               # joignable par les autres services, pas depuis l'hôte
    restart: unless-stopped
    read_only: true          # le conteneur ne peut pas écrire dans son système de fichiers
    security_opt:
      - no-new-privileges:true

  proxy:
    image: nginx:1.27-alpine
    container_name: cairn-proxy
    ports:
      - "${PROXY_PORT:-8080}:80"
    volumes:
      - ./docker/nginx-api.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy   # nginx ne démarre qu'une fois l'API "healthy"
    restart: unless-stopped
